name: Run analysis plan

# Two ways to start a run:
#  1. The planner agent posts the plan as a comment and adds the label
#     "plan-ready". Only people with triage rights (and the app orchestrator
#     acting after a collaborator's "approved" gate) can add labels, so outsiders
#     cannot start runs.
#  2. A maintainer dispatches the workflow manually with the issue number, e.g.
#     `gh workflow run run-analysis.yml -f issue_number=12`.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the issue whose plan comment holds the plan JSON"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  run:
    # Label event: only react to the "plan-ready" label. Manual dispatch: always run.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'plan-ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 0. Work out which issue to run, regardless of how the workflow started.
      - name: Resolve issue number
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed(`Invalid issue number: ${context.payload.inputs?.issue_number}`);
              return;
            }
            core.setOutput('number', number);

      # 1. Take the plan JSON from the issue (never passed through the shell).
      #    The planner posts the plan as a comment; prefer the most recent comment
      #    that holds a "### Analysis plan (JSON)" block, and fall back to the issue
      #    body for a manually filled Analysis request.
      - name: Extract plan from issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = ${{ steps.issue.outputs.number }};
            const planRe = /### Analysis plan \(JSON\)\s+```json\s*([\s\S]*?)```/;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number, per_page: 100 });
            let plan = null;
            for (const c of comments) {           // newest matching comment wins
              const m = (c.body || '').match(planRe);
              if (m) plan = m[1].trim();
            }
            if (!plan) {                           // fall back to the issue body
              const m = (issue.body || '').match(planRe);
              if (m) plan = m[1].trim();
            }
            if (!plan) { core.setFailed('No plan JSON found in the issue comments or body.'); return; }
            require('fs').writeFileSync('plan.json', plan);

      # 2. Reject plans that do not follow the schema.
      - name: Validate plan against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile .github/skills/air-quality-analyst/assets/schemas/plan.schema.json plan.json

      # 3. Verify the sensor data committed in the repo (data_sensors.parquet is
      #    ~80 MB; it originates from Zenodo record 23762846 and is checked in so
      #    runs do not re-download it).
      - name: Verify committed sensor data
        run: |
          set -euo pipefail
          echo "9bbbd14b42af5daa071300ce28e72cb7  data/data_sensors.parquet" | md5sum -c -
          echo "9569ae4615bb0bfd25f1a9810376773a  data/metadata_sensors.parquet" | md5sum -c -

      # 4. Run the plan with R (validated Tier-1 functions + openair).
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "nanoparquet", "dplyr", "lubridate", "openair"))'
      - name: Run analysis
        run: Rscript scripts/run_analysis.R plan.json out data

      # 5. Keep every output as a downloadable artifact (reproducibility).
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ steps.issue.outputs.number }}
          path: out/

      # 6. Post results and audit log back to the issue, with a per-step summary.
      - name: Comment results
        uses: actions/github-script@v7
        with:
          script: |
            const number = ${{ steps.issue.outputs.number }};
            const fs = require('fs');
            const results = fs.readFileSync('out/03_results.json', 'utf8');
            const audit = fs.readFileSync('out/audit.jsonl', 'utf8');
            // Build a per-step status table from the results steps.
            let summary = '| # | Step | Tool | Tier | Status |\n|---|---|---|---|---|\n';
            try {
              const parsed = JSON.parse(results);
              (parsed.steps || []).forEach((s, i) => {
                summary += `| ${i + 1} | ${s.step ?? ''} | ${s.tool ?? ''} | ${s.tier ?? ''} | ${s.status ?? ''} |\n`;
              });
            } catch (e) {
              summary = '_(could not parse step summary; see the full results below)_\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number,
              body: `## Results (steps 3–5: data check, sensor check and background, analysis)\n\n### Steps\n\n${summary}\n### 03_results.json\n\n\`\`\`json\n${results}\n\`\`\`\n\n### Audit log\n\n\`\`\`json\n${audit}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, labels: ['results-ready']
            });

      # 7. If anything above failed, flag the issue for a human and stop the chain.
      - name: Flag failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Resolve the issue number from either source. On a label event the
            // "Resolve issue number" step sets the output; but if the job failed
            // before that step ran, fall back to the labeled issue on the event
            // payload (0 on manual dispatch, where there is no event issue).
            const number = Number('${{ steps.issue.outputs.number }}') || ${{ github.event.issue.number || 0 }};
            if (!number) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number,
              body: `## Analysis failed\n\nThe analysis workflow did not finish. A maintainer should look.\n\nRun: ${url}`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number,
              labels: ['needs-attention']
            }).catch(() => {});
            await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number, name: 'app-working'
            }).catch(() => {});
