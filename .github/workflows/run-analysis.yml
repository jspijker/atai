name: Run analysis plan

# Two ways to start a run:
#  1. A maintainer adds the label "run-analysis" to an analysis-request issue.
#     Only people with triage rights can add labels, so outsiders cannot start runs.
#  2. A maintainer (or an agent acting on their behalf) dispatches the workflow
#     manually with the issue number, e.g. `gh workflow run run-analysis.yml -f issue_number=12`.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the analysis-request issue that holds the plan JSON"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  run:
    # Label event: only react to the "run-analysis" label. Manual dispatch: always run.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 0. Work out which issue to run, regardless of how the workflow started.
      - name: Resolve issue number
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed(`Invalid issue number: ${context.payload.inputs?.issue_number}`);
              return;
            }
            core.setOutput('number', number);

      # 1. Take the plan JSON out of the issue body (never passed through the shell).
      - name: Extract plan from issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = ${{ steps.issue.outputs.number }};
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number });
            const body = issue.body || '';
            const m = body.match(/### Analysis plan \(JSON\)\s+```json\s*([\s\S]*?)```/);
            if (!m) { core.setFailed('No plan JSON found in the issue.'); return; }
            require('fs').writeFileSync('plan.json', m[1].trim());

      # 2. Reject plans that do not follow the schema.
      - name: Validate plan against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile .github/skills/air-quality-analyst/assets/schemas/plan.schema.json plan.json

      # 3. Download the sensor data (not in the repo; ~80 MB) from Zenodo.
      - name: Download sensor data from Zenodo
        run: |
          set -euo pipefail
          mkdir -p data
          base="https://zenodo.org/records/23762846/files"
          declare -A sums=(
            [data_sensors.parquet]=9bbbd14b42af5daa071300ce28e72cb7
            [metadata_sensors.parquet]=9569ae4615bb0bfd25f1a9810376773a
          )
          for f in "${!sums[@]}"; do
            curl -fsSL "$base/$f?download=1" -o "data/$f"
            echo "${sums[$f]}  data/$f" | md5sum -c -
          done

      # 4. Run the plan with R (validated Tier-1 functions + openair).
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "nanoparquet", "dplyr", "lubridate", "openair"))'
      - name: Run analysis
        run: Rscript scripts/run_analysis.R plan.json out data

      # 5. Keep every output as a downloadable artifact (reproducibility).
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ steps.issue.outputs.number }}
          path: out/

      # 6. Post results and audit log back to the issue.
      - name: Comment results
        uses: actions/github-script@v7
        with:
          script: |
            const number = ${{ steps.issue.outputs.number }};
            const fs = require('fs');
            const results = fs.readFileSync('out/03_results.json', 'utf8');
            const audit = fs.readFileSync('out/audit.jsonl', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number,
              body: `## Results (steps 3–5: data check, sensor check and background, analysis)\n\n\`\`\`json\n${results}\n\`\`\`\n\n## Audit log\n\n\`\`\`json\n${audit}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, labels: ['results-ready']
            });
