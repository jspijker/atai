name: Run analysis plan

# Runs when a maintainer adds the label "run-analysis" to an analysis-request issue.
# Only people with triage rights can add labels, so outsiders cannot start runs.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  run:
    if: github.event.label.name == 'run-analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Take the plan JSON out of the issue body (never passed through the shell).
      - name: Extract plan from issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(/### Analysis plan \(JSON\)\s+```json\s*([\s\S]*?)```/);
            if (!m) { core.setFailed('No plan JSON found in the issue.'); return; }
            require('fs').writeFileSync('plan.json', m[1].trim());

      # 2. Reject plans that do not follow the schema.
      - name: Validate plan against schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile .github/skills/air-quality-analyst/assets/schemas/plan.schema.json plan.json

      # 3. Run the plan with R (validated functions + openair).
      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "openair"), repos = "https://cloud.r-project.org")'
      - name: Run analysis
        run: Rscript scripts/run_analysis.R plan.json out

      # 4. Keep every output as a downloadable artifact (reproducibility).
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.event.issue.number }}
          path: out/

      # 5. Post results and audit log back to the issue.
      - name: Comment results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('out/03_results.json', 'utf8');
            const audit = fs.readFileSync('out/audit.jsonl', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Results (steps 3–5)\n\n\`\`\`json\n${results}\n\`\`\`\n\n## Audit log\n\n\`\`\`json\n${audit}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: ['results-ready']
            });
