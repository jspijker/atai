name: Research question
description: A resident's air-quality question in plain words. An agent turns it into an analysis request with a plan (step 1–2 of the skill).
title: "[Research question] "
labels: ["research-question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask your air-quality question in your own words. You do **not** need to
        write a plan. After a maintainer or collaborator approves your question
        (by adding the `approved` label), the `analysis-request-planner` agent
        posts a plan here, the analysis runs automatically, and each step is added
        as a comment on this issue.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: The question exactly as you would ask it.
      placeholder: Was the air worse in January than in December, near my street?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location (postcode or street)
      description: A Dutch postcode (e.g. "1941" or "1941 AB") or street works best. The plan needs a place to pick nearby sensors.
      placeholder: "1941"
    validations:
      required: false
  - type: input
    id: period
    attributes:
      label: Period (optional)
      description: Which dates or months? Leave empty to use the last full calendar month.
      placeholder: December 2024 vs January 2025
    validations:
      required: false
  - type: dropdown
    id: pollutant
    attributes:
      label: Pollutant (optional)
      description: Leave as "Not sure" to default to PM2.5. NO2 and PM1 are not in this dataset.
      options:
        - Not sure
        - PM2.5
        - PM10
        - NO2
    validations:
      required: false
  - type: dropdown
    id: language
    attributes:
      label: Language for the answer
      options:
        - Nederlands
        - English
    validations:
      required: false
